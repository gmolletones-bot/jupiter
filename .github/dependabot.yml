# Weekly pull requests to keep dependencies up to date.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Electron carries Chromium's security fixes: its own PR, never bundled.
      electron:
        patterns:
          - electron
      # Everything else: one PR with all minor and patch updates.
      dependencias:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
